<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="app">

        <!-- =========================
             Heading
        ========================== -->

        <h1>Task Manager</h1>


        <!-- =========================
             Dark Mode
        ========================== -->

        <button id="dark-mode-btn">
            Dark Mode
        </button>


        <!-- =========================
             Input Area
        ========================== -->

        <div id="input-area">

            <input
                type="text"
                id="task-input"
                placeholder="Enter your task"
            >


            <input
                type="date"
                id="due-date"
            >


            <select id="priority-select">

                <option value="High">
                    🔴 High
                </option>

                <option value="Medium" selected>
                    🟡 Medium
                </option>

                <option value="Low">
                    🟢 Low
                </option>

            </select>


            <button class="add-btn">
                Add Task
            </button>

        </div>


        <!-- =========================
             Task Count
        ========================== -->

        <p id="task-count">
            Total Tasks: 0 | Completed: 0
        </p>


        <!-- =========================
             Dashboard
        ========================== -->

        <div id="dashboard">

            <div class="stat-card">

                <span class="stat-icon">
                    📋
                </span>

                <h3 id="total-stat">
                    0
                </h3>

                <p>
                    Total Tasks
                </p>

            </div>


            <div class="stat-card">

                <span class="stat-icon">
                    ✅
                </span>

                <h3 id="completed-stat">
                    0
                </h3>

                <p>
                    Completed
                </p>

            </div>


            <div class="stat-card">

                <span class="stat-icon">
                    ⏳
                </span>

                <h3 id="pending-stat">
                    0
                </h3>

                <p>
                    Pending
                </p>

            </div>

        </div>


        <!-- =========================
             Progress Bar
        ========================== -->

        <div id="progress-container">

            <div id="progress-bar"></div>

        </div>


        <!-- =========================
             Progress Percentage
        ========================== -->

        <div id="progress-box">

            <p id="progress-text">
                0% Completed
            </p>

        </div>


        <!-- =========================
             Search
        ========================== -->

        <div id="search-area">

            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search tasks..."
            >

        </div>


        <!-- =========================
             Filters
        ========================== -->

        <div id="filter-area">

            <button
                class="filter-btn"
                data-filter="all"
            >
                All
            </button>


            <button
                class="filter-btn"
                data-filter="active"
            >
                Active
            </button>


            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- =========================
             Clear All
        ========================== -->

        <button id="clear-all-btn">
            Clear All Tasks
        </button>


        <!-- =========================
             Task Container
        ========================== -->

        <div id="task-container"></div>

    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
